name: Submit extension update

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release and download the store package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets | jq -e '
            [.assets[] | select(.state == "uploaded" and .size > 0) | .name] |
            contains(["Margin-Web-Store.zip", "Margin-Connect-macOS.zip", "Margin-Connect-Windows.exe"])'
          gh release download "$RELEASE_TAG" --pattern Margin-Web-Store.zip
          unzip -p Margin-Web-Store.zip manifest.json | jq -e --arg tag "$RELEASE_TAG" '
            (.version | test("^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$")) and
            ("v" + .version == $tag) and (has("key") | not)'
      - name: Submit to the Chrome Web Store
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.MARGIN_CHROME_STORE_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publish-store.js
