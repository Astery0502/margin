<div id="margin-rail" class="viz-dotted-background">
<style>
#margin-rail{padding:14px 0;display:grid;justify-items:center}
#margin-rail .rail{color-scheme:light dark;--paper:light-dark(#fcfdf8,#20271e);--wash:light-dark(#eef3e8,#344031);--ink:light-dark(#354432,#e4eadf);--dim:light-dark(#62705b,#b3bfaa);--edge:light-dark(#d8e1d2,#475542);width:min(100%,360px);height:465px;display:flex;flex-direction:column;box-sizing:border-box;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
#margin-rail .rail *{box-sizing:border-box} #margin-rail [hidden]{display:none!important}
#margin-rail .chrome,#margin-rail .tools,#margin-rail .group,#margin-rail .compose-actions{display:flex;align-items:center;gap:5px}
#margin-rail .chrome{background:var(--wash);padding:8px 12px;font-weight:600;letter-spacing:-.025em}
#margin-rail .rail svg{width:16px;height:16px;flex:none}
#margin-rail .tools{padding:6px 8px;border-bottom:1px solid var(--edge)}
#margin-rail button,#margin-rail summary{font:inherit;color:inherit;cursor:pointer}
#margin-rail button{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:32px;background:transparent;border:0;border-radius:5px;padding:4px 7px}
#margin-rail button:hover,#margin-rail button[aria-pressed=true]{background:var(--wash)}
#margin-rail .fill{flex:1;min-width:0} #margin-rail .clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#margin-rail .view{min-height:0;flex:1;display:flex;flex-direction:column}
#margin-rail .group{padding:8px 12px 4px;color:var(--dim);font-size:12px}
#margin-rail .entries,#margin-rail .thread-body{padding:0 12px;overflow:auto;flex:1}
#margin-rail .entry{display:grid;justify-content:stretch;text-align:left;width:100%;padding:9px 8px;gap:2px;border-bottom:1px solid var(--edge);border-radius:0}
#margin-rail .entry small,#margin-rail summary,#margin-rail .subtle{color:var(--dim);font-size:12px}
#margin-rail .entry.active{background:var(--wash);border-radius:5px}
#margin-rail details{margin:10px 0} #margin-rail blockquote{margin:8px 0;padding-left:10px;border-left:2px solid var(--edge);color:var(--dim)}
#margin-rail .question{background:var(--wash);padding:9px 12px;border-radius:12px 12px 3px 12px;width:fit-content;margin:16px 0 14px auto}
#margin-rail .answer{font:16px/1.55 Georgia,serif;margin:0}
#margin-rail .composer{margin:12px;padding:9px 10px 5px;border:1px solid var(--edge);border-radius:10px}
#margin-rail textarea,#margin-rail input[type=search]{font:inherit;color:inherit;background:var(--paper);width:100%;border:0}
#margin-rail textarea{resize:none;height:32px}
#margin-rail .compose-actions{justify-content:flex-end;color:var(--dim);font-size:12px}
#margin-rail .searchbox,#margin-rail .choices{padding:6px 12px;border-bottom:1px solid var(--edge)}
#margin-rail .choices{display:flex;align-items:center;gap:10px}
#margin-rail .choices label{font-size:12px}
#margin-rail .pageprefs{padding:12px} #margin-rail .pageprefs h3{font-size:14px;margin:12px 0 2px}
#margin-rail .groupname{padding:7px 6px;color:var(--dim);font-size:12px}
</style>
<section class="rail" aria-label="Margin side panel">
<div class="chrome"><i data-lucide="book-open" aria-hidden="true"></i>Margin</div>
<section class="view" data-view="thread">
<div class="tools"><button data-go="list" aria-label="Back to list"><i data-lucide="arrow-left" aria-hidden="true"></i>List</button><strong class="fill clip" data-title></strong><button data-go="settings" data-tooltip="Margin settings" aria-label="Margin settings"><i data-lucide="settings" aria-hidden="true"></i></button></div>
<div class="thread-body"><details><summary>Source</summary><small data-source></small><blockquote data-quote></blockquote></details><p class="question"></p><p class="answer"></p></div>
<div class="composer"><textarea aria-label="Discussion draft" placeholder="Ask about this passage…"></textarea><div class="compose-actions" aria-hidden="true"><i data-lucide="mic"></i><i data-lucide="arrow-up"></i></div></div>
</section>
<section class="view" data-view="list" hidden>
<div class="tools"><button data-scope="page">This page</button><button data-scope="all">All pages</button><span class="fill"></span><button aria-label="Search discussions" data-search data-tooltip="Search discussions"><i data-lucide="search" aria-hidden="true"></i></button><button aria-label="List options" data-options data-tooltip="List options"><i data-lucide="ellipsis" aria-hidden="true"></i></button><button data-go="settings" data-tooltip="Margin settings" aria-label="Margin settings"><i data-lucide="settings" aria-hidden="true"></i></button></div>
<div class="searchbox" hidden><input type="search" aria-label="Find discussions" placeholder="Find discussions"></div>
<div class="choices" hidden><label><input type="checkbox" data-archived> Show archived</label><button data-select>Select discussions</button></div>
<div class="entries"></div>
</section>
<section class="view" data-view="settings" hidden><div class="tools"><button data-return><i data-lucide="arrow-left" aria-hidden="true"></i>Back</button><strong>Margin settings</strong></div><div class="pageprefs"><h3>Account</h3>ChatGPT subscription<h3>Agents</h3>Default agent<h3>Dictation</h3>Spoken language</div></section>
</section>
</div>
<script>
(()=>{
const root=document.getElementById('margin-rail'), q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
const book='The Shape of a Footnote', other='Reading in the Margins';
const items=[
['Why footnotes interrupt',book,'A note asks the reader to hold a place in two texts at once.','What does the reader have to remember?','Two things: where the sentence left off, and which part of it the note explains. A short note keeps that return trip easy.'],
['A note beside the sentence',book,'In the margin, the note stays in sight.','What changes in a printed margin?','The note and the sentence stay visible together. Your eye can move between them without losing its place.'],
['When a citation is enough',book,'Sometimes the reference itself is the whole note.','When would the short version work?','When the reader only needs to identify a source, a brief reference can do the whole job.'],
['Marks on a second reading',other,'A pencilled line can become a record of a first reading.','Why keep an old mark?','It records what drew your attention the first time.'],
['Notes at the end',book,'The last pages hold a quieter conversation.','Why move the notes?','Endnotes leave the main page clear.']
];
let view='thread',scope='page',active=0,previous='thread',selecting=false;
const drafts={},entries=q('.entries'),draft=q('textarea'),search=q('input[type=search]');
function save(){window.openai?.setWidgetState?.({modelContent:{view,scope},privateContent:{active,previous}})?.catch(()=>{});}
function paint(){
qa('[data-view]').forEach(el=>el.hidden=el.dataset.view!==view);
qa('[data-scope]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.scope===scope)));
const [title,source,quote,question,answer]=items[active];
q('[data-title]').textContent=title;q('[data-title]').dataset.tooltip=title;q('[data-source]').textContent=source;q('[data-quote]').textContent=quote;q('.question').textContent=question;q('.answer').textContent=answer;
const top=entries.scrollTop;entries.replaceChildren();
for(const src of (scope==='all'?[book,other]:[book])){
const rows=items.map((v,i)=>({v,i})).filter(({v,i})=>v[1]===src&&(i!==4||q('[data-archived]').checked)&&(v[0]+' '+src).toLowerCase().includes(search.value.toLowerCase()));
if(!rows.length)continue;
const header=document.createElement('div');header.className='groupname clip';header.textContent=src;entries.append(header);
for(const {v,i} of rows){
const b=document.createElement(selecting?'label':'button');b.className='entry'+(active===i?' active':'');
if(selecting){const c=document.createElement('input');c.type='checkbox';c.setAttribute('aria-label','Select '+v[0]);b.append(c);}
else {b.addEventListener('click',()=>{drafts[active]=draft.value;active=i;draft.value=drafts[i]||'';q('details').open=false;go('thread');});}
const name=document.createElement('span');name.className='clip';name.textContent=(i===4?'Archived · ':'')+v[0];const sub=document.createElement('small');sub.className='clip';sub.textContent='“'+v[2]+'”';b.append(name,sub);entries.append(b);
}}
if(!entries.children.length)entries.textContent='No matching discussions.';entries.scrollTop=top;
}
function go(next){if(next==='settings')previous=view;view=next;paint();save();}
qa('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));q('[data-return]').onclick=()=>go(previous);
qa('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;paint();save();});
q('[data-search]').onclick=()=>{const box=q('.searchbox');box.hidden=!box.hidden;if(!box.hidden)search.focus();else{search.value='';paint();}};
search.oninput=paint;q('[data-options]').onclick=()=>{q('.choices').hidden=!q('.choices').hidden;};
q('[data-archived]').onchange=paint;q('[data-select]').onclick=()=>{selecting=!selecting;q('[data-select]').textContent=selecting?'Done':'Select discussions';paint();};
function restore(s){if(s){const m=s.modelContent||{},p=s.privateContent||{};if(['thread','list','settings'].includes(m.view))view=m.view;if(['page','all'].includes(m.scope))scope=m.scope;if(Number.isInteger(p.active)&&items[p.active])active=p.active;if(['thread','list'].includes(p.previous))previous=p.previous;}paint();}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
})();
</script>
