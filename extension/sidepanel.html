<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="shared/marked.umd.js" defer></script>
  <script src="shared/purify.min.js" defer></script>
  <script src="shared/katex.min.js" defer></script>
  <script src="shared/markdown-math.js" defer></script>
  <script src="shared/messages.js" defer></script>
  <script src="shared/extension-ui.js" defer></script>
  <script src="shared/model-preferences.js" defer></script>
  <script src="client.js" defer></script>
  <script src="brand.js" defer></script>
  <script src="model-picker.js" defer></script>
  <script src="conversation.js" defer></script>
  <script src="sidepanel.js" type="module"></script>
</head>
<body data-view="list">
  <header class="panel-heading">
    <div class="tools" id="list-tools">
      <div id="scope" role="radiogroup" aria-label="Discussion scope">
        <label><input type="radio" name="scope" value="page" checked><span>Page</span></label>
        <label><input type="radio" name="scope" value="all"><span>All</span></label>
      </div>
      <button id="search-toggle" class="icon-button" aria-label="Search discussions" data-hint="Search" aria-expanded="false" aria-controls="search-bar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg></button>
      <button id="show-archived" class="icon-button" aria-label="Include archived discussions" data-hint="Archived" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8v12h16V8M3 4h18v4H3zM9 12h6"/></svg></button>
      <button id="select-mode" class="icon-button" aria-label="Select discussions" data-hint="Select"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 1.6 1.6L8 4m-5 9 1.6 1.6L8 11m-5 9 1.6 1.6L8 18M11 6h10m-10 7h10m-10 7h10"/></svg></button>
    </div>
    <div class="tools" id="selection-tools">
      <button id="select-all">Select all</button><output id="selection-count">0 selected</output>
      <button id="delete-selected" disabled>Delete</button><button id="done-selecting">Done</button>
    </div>
    <div class="tools" id="thread-tools">
      <button id="list-toggle" class="icon-button" aria-label="Back to list" data-hint="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M4 12h16"/></svg></button>
      <button id="source-toggle" aria-controls="source-card" aria-expanded="false" disabled><span id="panel-title"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <fieldset id="thread-actions" aria-label="Discussion actions" disabled></fieldset>
    </div>
    <button id="settings" class="icon-button" aria-label="Margin settings" data-hint="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-.6 2.2-2 .9-2-.8-2 3.4 1.6 1.5v2.5l-1.6 1.6 2 3.5 2.1-.7 2 1 .5 2.2h4l.6-2.2 2-1 2 .7 2-3.5-1.6-1.6v-2.5l1.6-1.5-2-3.4-2 .8-2-.9L14 3Z"/><circle cx="12" cy="11.7" r="3"/></svg>
    </button>
  </header>
  <section id="directory" aria-label="Discussion list">
    <div id="search-bar" hidden><input id="discussion-filter" type="search" aria-label="Find discussions" placeholder="Find discussions"></div>
    <div id="discussion-list"></div>
    <nav id="pagination" hidden aria-label="Discussion pages"><button id="previous-discussions">Previous</button><span id="discussion-count"></span><button id="next-discussions">Next</button></nav>
  </section>
  <template id="page-summary-template">
    <section class="page-summary" aria-label="Page summary">
      <p class="usage" role="status">Loading page usage…</p>
      <dl hidden>
        <div><dt>History</dt><dd data-field="history"></dd></div>
        <div><dt>Saved text</dt><dd data-field="text"></dd></div>
        <div><dt>Working files</dt><dd data-field="files"></dd></div>
      </dl>
      <button class="text-action" data-action="clear" hidden>Clear working files</button>
      <button class="text-action" data-action="export">Export discussions</button>
    </section>
  </template>
  <main id="thread">
    <section id="source-card" hidden aria-label="Source passage">
      <a id="source-link" target="_blank" rel="noreferrer"></a>
      <blockquote id="source-quote"></blockquote>
    </section>
    <p id="other-page" hidden>This discussion belongs to another page.</p>
    <div id="conversation" hidden></div>
  </main>
  <div id="icon-hint" aria-hidden="true" hidden></div>
  <footer id="feedback" role="status" aria-live="polite"></footer>
</body>
</html>
