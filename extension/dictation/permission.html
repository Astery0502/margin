<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Allow Margin dictation</title><link rel="stylesheet" href="permission.css"></head>
<body><main><h1>Allow microphone access</h1><p>Margin uses your microphone only when you start dictation. Your first transcription downloads a speech model (about 44 MB). After that, dictation works offline. Your recording stays on this device.</p><button id="allow">Allow microphone and start</button><button id="cancel">Cancel</button><p id="status" role="status">Your browser may ask for microphone access.</p></main><script type="module" src="permission.js"></script></body>
</html>
