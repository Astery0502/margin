<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF</title>
  <link rel="stylesheet" href="pdfjs/pdf_viewer.css">
  <link rel="stylesheet" href="reader.css">
  <script src="../shared/marked.umd.js" defer></script>
  <script src="../shared/purify.min.js" defer></script>
  <script src="../shared/katex.min.js" defer></script>
  <script src="../shared/markdown-math.js" defer></script>
  <script src="../shared/messages.js" defer></script>
  <script src="../shared/extension-ui.js" defer></script>
  <script src="../client.js" defer></script>
  <script src="../brand.js" defer></script>
  <script src="../passage-ui.js" defer></script>
  <script src="../conversation.js" defer></script>
  <script src="../image-capture.js" defer></script>
  <script src="../discussion-host.js" defer></script>
  <script src="open.js" type="module"></script>
</head>
<body>
  <nav id="reading-toolbar" aria-label="PDF controls">
    <button id="outline-toggle" data-icon="outline" title="Contents" aria-label="Contents" aria-expanded="false" aria-controls="outline" disabled></button>
    <button id="find-toggle" data-icon="find" title="Find in document" aria-label="Find in document" popovertarget="find-panel" disabled></button>
    <div id="page-controls" class="control-group">
      <button id="previous" data-icon="previous" title="Previous page" aria-label="Previous" disabled></button>
      <input id="page" type="number" aria-label="Page" min="1" value="1" disabled><span id="page-count"></span>
      <button id="next" data-icon="next" title="Next page" aria-label="Next" disabled></button>
    </div>
    <select id="zoom" aria-label="Zoom" title="Zoom" disabled><option value="page-width">Fit width</option><option value="page-fit">Fit page</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select>
    <div class="toolbar-space"></div>
    <div id="secondary-controls" class="control-group">
      <button id="return-passage" hidden>Return to passage</button>
      <button id="fit" data-icon="fit" title="Fit width" aria-label="Fit width" disabled></button>
      <button id="rotate" data-icon="rotate" title="Rotate" aria-label="Rotate" disabled></button>
      <a id="original" data-icon="original" title="Open source" aria-label="Open source" target="_blank" rel="noopener"></a>
      <button id="download" data-icon="download" title="Download" aria-label="Download" disabled></button>
    </div>
    <button id="more" data-icon="more" title="More" aria-label="More" popovertarget="more-menu" hidden></button>
  </nav>
  <div id="more-menu" popover></div>
  <section id="find-panel" popover aria-label="Search PDF">
    <input id="find-query" type="search" aria-label="Find text" placeholder="Find in document" autocomplete="off">
    <span id="find-count" role="status"></span>
    <button id="find-previous" data-icon="previous" aria-label="Previous match" title="Previous match"></button>
    <button id="find-next" data-icon="next" aria-label="Next match" title="Next match"></button>
    <button id="find-close" data-icon="close" aria-label="Close search" title="Close search"></button>
  </section>
  <aside id="outline" aria-label="Document contents" hidden><div id="outline-items"></div></aside>
  <div id="loading" role="status" aria-label="Loading PDF"></div>
  <section id="load-error" role="alert" hidden>
    <p id="load-error-text"></p><button id="retry">Retry from website</button>
    <label class="file-button">Open saved PDF<input id="file" type="file" accept="application/pdf,.pdf" disabled></label>
    <p>Open a copy saved from the source to keep this document's discussions.</p>
  </section>
  <div id="viewer-container"><div id="viewer" class="pdfViewer"></div></div>
  <button id="summary" type="button"></button>
  <div id="selection-tools" role="toolbar" aria-label="Discuss passage" hidden>
    <div id="selection-actions"><button id="quick" aria-label="Quick"></button><button id="full" aria-label="Full"></button></div>
    <p id="selection-error" role="alert" hidden></p>
  </div>
  <section id="discussion" role="dialog" aria-label="PDF discussion" hidden>
    <div class="discussion-heading"><button id="discussion-handle" aria-label="Move Quick discussion"><span id="discussion-mark" aria-hidden="true"></span><span id="discussion-title"></span></button><div id="discussion-actions" class="discussion-actions"></div></div>
    <div id="conversation"></div>
  </section>
</body>
</html>
