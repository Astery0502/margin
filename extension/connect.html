<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect ChatGPT · Margin</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="connect.js"></script>
</head>
<body>
<main class="sheet connection">
  <header class="masthead">
    <img src="icons/margin-48.png" width="28" height="28" alt="">
    <h1 id="heading">Connect an account</h1>
  </header>
  <div class="connection-body">
    <p id="status" role="status">Checking Margin Connect…</p>
    <p id="install" hidden><a class="text-action" id="download" download>Download Margin Connect</a>. <span id="install-help"></span></p>
    <div class="actions" id="providers" hidden>
      <a class="text-action" href="connect.html#passage">ChatGPT subscription</a>
      <a class="text-action" href="connect.html?provider=deepseek#passage">DeepSeek API</a>
    </div>
    <form id="deepseek" hidden>
      <label class="field">DeepSeek API key<input type="password" id="key" autocomplete="off" required></label>
      <p><a class="text-action" href="https://platform.deepseek.com/api_keys" target="_blank" rel="noreferrer">Get a DeepSeek API key</a></p>
      <button class="primary" type="submit">Connect DeepSeek</button>
    </form>
    <label class="field" id="accounts" hidden>ChatGPT account<select id="account"></select></label>
    <div class="actions">
      <button class="primary" id="connect" hidden>Continue with ChatGPT</button>
      <button class="secondary" id="retry" hidden>Check again</button>
      <button class="secondary" id="cancel" hidden>Cancel sign-in</button>
      <button class="secondary" id="disconnect" hidden>Disconnect account</button>
      <button class="primary" id="back" hidden>Return to passage</button>
    </div>
  </div>
</main>
</body>
</html>
